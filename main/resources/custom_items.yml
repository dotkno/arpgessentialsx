# ==========================================
# Custom Crafting Materials
# ==========================================
# Naming: mat1_ (Basic), mat2_ (Advanced), mat3_ (Endgame)
# These are used as ingredients in Weapon and Relic recipes.
# ==========================================

items:
  mat2_crucible_ingot:
    display_name: "&6Pure Netherite"
    material: IRON_INGOT
    custom_model_data: 201
    lore:
      - "&7An advanced material forged in the hidden depths of the Nether."
      - "&8Used to craft powerful weapons."
    recipe:
      shape:
        - "DND"
        - "NNN"
        - "DND"
      ingredients:
        N: NETHERITE_INGOT
        D: DIAMOND

  starmetal_ingot:
    display_name: "&bStarmetal Ingot"
    material: AMETHYST_SHARD
    custom_model_data: 9001
    amount: 1
    stackable: true
    lore:
      - "&7Refined starmetal used for advanced gear crafting."

  healing_berry:
    display_name: "&cHealing Berry"
    material: SWEET_BERRIES
    custom_model_data: 1101
    amount: 1
    consumable: true
    lore:
      - "&7A small berry that restores health."
    consume:
      heal: 6
      hunger: 4
      saturation: 2.4
      cooldown_seconds: 5
      sound: ENTITY_PLAYER_BURP
      particle: HEART
      particle_count: 8
      effects:
        - "REGENERATION:6:1"

  small_grenade:
    display_name: "&8Small Grenade"
    material: GUNPOWDER
    custom_model_data: 1201
    amount: 1
    throwable: true
    lore:
      - "&7Throw to explode on impact."
    throw:
      power: 1.8
      damage: 6.0
      cooldown_seconds: 3
      explode: true
      explosion_power: 2.5
      on_hit_effects:
        - "PARTICLE:EXPLOSION:20"
        - "SOUND:ENTITY_GENERIC_EXPLODE:1.0:1.0"
        - "POTION:SLOWNESS:4:1:3.5"

