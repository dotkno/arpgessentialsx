# ─────────────────────────────────────────────────────────────────────────────
# ARPGEssentialsX — classes.yml
# ─────────────────────────────────────────────────────────────────────────────
#
# HOW ATTRIBUTES WORK
# ───────────────────
# Minecraft's health is measured in half-hearts internally.
#   health: 2.0  = +1 heart  (e.g. 4.0 = +2 hearts)
#   health: -2.0 = -1 heart
#
# movement_speed: Minecraft's internal speed attribute (vanilla = 0.1)
#   speed: 0.01  = very slight boost
#   speed: -0.025 = slightly slower
#
# damage: flat attack damage added to melee attacks
#   damage: 1.0  = +1 attack damage
#   damage: -1.0 = -1 attack damage
#
# armor / armor_toughness: flat armor points (same scale as armor bar)
#
# knockback_resistance: 0.0 = no resistance, 1.0 = full immunity
#   0.05 = 5% knockback reduction
#
# HOW PASSIVES WORK
# ─────────────────
# Passives are numeric config values read by PassiveListener or PassiveTickTask.
# A value of 0.0 (or omitting the key) means "this passive is inactive."
#
# Fighter:    regen_delay (seconds OOC before regen triggers), regen_amount (HP per tick)
# Marksman:   ranged_damage_bonus (flat damage added to bow/crossbow hits)
# Assassin:   crit_multiplier_bonus (added on top of vanilla 1.5x crit; 0.15 → 1.65x total)
# Tank:       unbreakable_shields (1.0 = enabled, 0.0 = disabled)
# Mage:       (handled by SpellCastManager and MageRestrictionListener — no numeric value needed)
# ─────────────────────────────────────────────────────────────────────────────

fighter:
  display-name: "&c&lFighter"
  tag: 1
  icon: IRON_SWORD
  custom-model-data: -1
  lore:
    - "&7A damage-focused melee combatant."
    - "&7Durable enough to stay on the front line."
    - ""
    - "&f▸ &a+2 Hearts &8(+4 HP)"
    - "&f▸ &a+1 Melee Damage"
    - "&f▸ &a+2 Armor"
    - "&f▸ &a5% Knockback Resistance"
    - "&f▸ &6Passive: &eRegens 1 heart after 12s out of combat"
    - ""
    - "&8A solid all-rounder."
  attributes:
    health: 4.0              # +2 hearts
    damage: 1.0              # +1 melee damage
    speed: 0.0               # no change
    armor: 2.0               # +2 armor points
    armor_toughness: 0.0     # no change
    knockback_resistance: 0.05 # 5% knockback reduction
  passives:
    regen_delay: 12.0        # seconds out-of-combat before regen starts
    regen_amount: 2.0        # HP restored per regen tick (= 1 heart)

