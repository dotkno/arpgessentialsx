# ==========================================
# Custom Drop System Configuration
# ==========================================
# This file controls custom drops from mobs and mining.
# Drops are ADDITIONAL to vanilla drops - they don't replace them.
# 
# chance: Percentage (0-100) of the drop occurring
# min_amount: Minimum amount to drop
# max_amount: Maximum amount to drop (random between min and max)
# ==========================================

